<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube • Outdoor Odyssey</title>

    <style>
        :root {
            --brand-blue: #400CE0;
            --brand-orange: #FB8729;
            --brand-white: #F6F4F2;
            --text-dark: #1a1a1a;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--brand-white);
            color: var(--text-dark);
        }

        /* Opposite of homepage: ORANGE header */
        header {
            background: var(--brand-orange);
            color: var(--brand-white);
            padding: 2rem;
            text-align: center;
        }

        /* Opposite of homepage: BLUE nav */
        nav {
            background: var(--brand-blue);
            padding: 0.8rem;
            text-align: center;
        }

        nav a {
            color: var(--brand-white);
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .section {
            background: var(--brand-white);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            border-left: 6px solid var(--brand-orange); /* opposite of homepage */
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        .section h2 {
            color: var(--brand-orange); /* opposite of homepage */
        }

        .video iframe {
            max-width: 100%;
            border-radius: 8px;
            border: 3px solid var(--brand-blue); /* opposite of homepage */
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            background: var(--brand-orange); /* opposite of homepage */
            color: var(--brand-white);
            padding: 0.7rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .button:hover {
            background: #d96a1f;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background: var(--brand-orange); /* opposite of homepage */
            color: var(--brand-white);
            margin-top: 2rem;
        }
    </style>
</head>

<body>

<header>
    <h1>Outdoor Odyssey</h1>
    <p>YouTube Channel</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="youtube.html">YouTube</a>
</nav>

<main>

    <div class="section">
        <h2>Latest Videos</h2>

    <div class="video">
        <iframe width="560" height="315" 
            src="https://www.youtube.com/embed/eYb_xyKPQD8?si=14MmQsIoxjTpVe7G" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
            
            </iframe>
        </div>
        
        <div class="video">
            <iframe width="560" height="315"
                src="https://www.youtube.com/embed/SblvsdBJosk"
                title="YouTube video"
                frameborder="0"
                allowfullscreen>
            </iframe>
        </div>

        <p>
    Visit the full channel for more adventures:
    <a href="https://www.youtube.com/@OutdoorOdyssey1383" target="_blank">
        Outdoor Odyssey YouTube Channel
    </a>
</p>
