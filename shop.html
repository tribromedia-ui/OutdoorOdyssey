<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop • Outdoor Odyssey</title>

    <style>
        :root {
            --brand-blue: #400CE0;
            --brand-orange: #FB8729;
            --brand-white: #F6F4F2;
            --brand-black: #090000;
            --text-dark: #1a1a1a;
        }

        body {
            margin: 0;
            font-family: busch script MT, Arial, sans-serif;
            background: var(--brand-white);
            color: var(--text-dark);
        }

        header {
            background: var(--brand-orange);
            color: var(--brand-white);
            padding: 2rem;
            text-align: center;
        }

        nav {
            background: var(--brand-blue);
            padding: 0.8rem;
            text-align: center;
        }

        nav a {
            color: var(--brand-white);
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 1rem;
        }

        h1 {
            text-align: center;
            color: var(--brand-orange);
            margin-bottom: 2rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--brand-white);
            padding: 1.2rem;
            border-radius: 10px;
            border-left: 6px solid var(--brand-blue);
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            text-align: center;
            transition: transform 0.2s ease;
        }

        .product-card:hover {
            transform: scale(1.03);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
        }

        .product-card h3 {
            margin: 15px 0 10px;
            color: var(--brand-black);
        }

        .price {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--brand-orange);
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: var(--brand-blue);
            color: var(--brand-white);
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background: #2f0ab0;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background: var(--brand-orange);
            color: var(--brand-white);
            margin-top: 2rem;
        }
    </style>
</head>

<body>

<header>
    <h1>Outdoor Odyssey Shop</h1>
    <p>Camping Gear & Outdoor Essentials</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="youtube.html">YouTube</a>
    <a href="shop.html">Shop</a>
</nav>

<main>

    <h1>Shop Camping Gear</h1>

    <div class="product-grid">

        <div class="product-card">
            <img src="images/tent.jpg" alt="Camping Tent">
            <h3>2‑Person Lightweight Tent</h3>
            <p class="price">$89.99</p>
            <a class="btn" href="#">Add to Cart</a>
        </div>

        <div class="product-card">
            <img src="images/campstove.jpg" alt="Camp Stove">
            <h3>Portable Camp Stove</h3>
            <p class="price">$49.99</p>
            <a class="btn" href="#">Add to Cart</a>
        </div>

        <div class="product-card">
            <img src="images/lantern.jpg" alt="Lantern">
            <h3>Rechargeable LED Lantern</h3>
            <p class="price">$24.99</p>
            <a class="btn" href="#">Add to Cart</a>
        </div>

        <div class="product-card">
            <img src="images/sleepingbag.jpg" alt="Sleeping Bag">
            <h3>All‑Season Sleeping Bag</h3>
            <p class="price">$59.99</p>
            <a class="btn" href="#">Add to Cart</a>
        </div>

    </div>

</main>

<footer>
    © 2026 Outdoor Odyssey
</footer>

</body>
</html>
